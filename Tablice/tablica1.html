<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablice vjezba</title>
  </head>
  <body>
    <h1>Tablice</h1>

    <table border="1" style="border-collapse: collapse">
      <tr>
        <th>Tvrtka</th>
        <th>Kontakt</th>
        <th>Zemlja</th>
      </tr>
      <tr>
        <td>Microsoft</td>
        <td>Jozo Bošnjak</td>
        <td>Hrvatska</td>
      </tr>
      <tr>
        <td>Jerko Trans</td>
        <td>Mislav Jerković</td>
        <td>Hrvatska</td>
      </tr>
    </table>
    <h2>Spajanje stupaca</h2>
    <table border="1" style="border-collapse: collapse">
      <tr>
        <th colspan="2">Ime i Prezime</th>

        <th>Godina</th>
      </tr>
      <tr>
        <td colspan="2">Ivo Ivic</td>

        <td>54</td>
      </tr>
      <tr>
        <td colspan="2">Jozo Ivic</td>

        <td>16</td>
      </tr>
    </table>
    <h2>Spajanje redaka</h2>
    <table border="1" style="width: 600px">
      <tr>
        <th>Ime</th>
        <td>Josip</td>
      </tr>
      <tr>
        <th rowspan="2">Mobitel</th>
        <td style="text-align: center">555-555-5555</td>
      </tr>
      <tr>
        <td style="text-align: center">555-511-5555</td>
      </tr>
    </table>
  </body>
</html>
