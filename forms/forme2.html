<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Upisnica</h1>

    <form 
      action="" 
      method="get"
      <label for="">Roll no:</label>
      <input type="text" id="nmr">
      <br>
      <label for="">Student name:</label>
      <input type="text" id="ime" placeholder="First Name">
      <input type="text" id="prezime" placeholder="Last Name">
      <br>
      <label for="">Fathers name:</label>
      <input type="text" id="Fanme">
      <br>
      <label for="date">Date of birth</label>
      <input type="date" name="date" id="date">
      <var>(DD-MM-YYYY)</var>
      <br>
      <label for="">Mobile no.:</label>
      <input type="tel" name="tel" id="tel">
      <br>
      <label for="email">Email id:</label>
      <input type="email" name="email" id="email">
      <br>
      <label for="password">Password:</label>
      <input type="password" name="pas" id="pas">
      <br>
      <label for="">Gender:</label>
      <input type="radio" name="gender" id="m" value="Male">
      <label for="m">Male</label>
      <input type="radio" name="gender" id="f" value="Female">
      <label for="f">Female</label>
      <br>
      <label for="">Department:</label>
      <input type="checkbox" name="dep1" id="CSE" value="CSE">
      <label for="CSE">CSE</label>
      <input type="checkbox" name="dep2" id="IT" value="IT">
      <label for="IT">IT</label>
      <input type="checkbox" name="dep3" id="ECE" value="ECE">
      <label for="ECE">ECE</label>
      <input type="checkbox" name="dep4" id="Civil" value="Civil">
      <label for="Civil">Civil</label>
      <input type="checkbox" name="dep5" id="Mech" value="Mech">
      <label for="Mech">Mech</label>
      <br>
      <label for="">Course</label>
      <select name="course" id="course">
        <option value="1st">1st</option>
        <option value="2nd">2nd</option>
        <option value="3rd">3rd</option>
      </select>
      <br>
      <label for="file">Student photo:</label>
      <input type="file" name="photo" id="photo">
      <br>
      <label for="">City:</label>
      <input type="text" id="city">
      <br>
      <label for="">Address:</label>
      <textarea name="Address" id="Address"></textarea>
      <br>
      <input type="submit" value="Register">
    </form>
  </body>
</html>
